<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impact Finance</title>

  <!-- Ícones (substitui pelos PNGs que geraste) -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Manifest PWA (se estiver a usar) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ff88">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <!-- TELA DE LOGIN -->
    <section id="login-section">
      <h2>Login</h2>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Utilizador" required>
        <input type="password" id="login-password" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="login-msg" class="login-msg"></p>
    </section>

    <!-- APP DE FINANÇAS (OCULTO ATÉ LOGAR) -->
    <div id="app-section" style="display:none;">

      <header style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;">
        <h1>Impact Finance</h1>
        <button id="btn-logout">Sair</button>
      </header>

      <!-- DASHBOARD -->
      <section class="dashboard-grid">
        <div class="card receita-card">
          <h3>Receitas</h3>
          <div class="valor-grande" id="total-receitas">€ 0,00</div>
        </div>
        <div class="card despesa-card">
          <h3>Despesas</h3>
          <div class="valor-grande" id="total-despesas">€ 0,00</div>
        </div>
        <div class="card saldo-card">
          <h3>Saldo</h3>
          <div class="valor-grande" id="saldo">€ 0,00</div>
        </div>
      </section>

      <!-- FORMULÁRIO -->
      <section>
        <h2>Novo Lançamento</h2>
        <form id="form-transacao">
          <input type="date" id="data" required>
          <input type="text" id="descricao" placeholder="Descrição" required>
          <input type="text" id="categoria" placeholder="Categoria" required>
          <select id="tipo">
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
          </select>
          <input type="number" step="0.01" id="valor" placeholder="0,00" required>

          <label>
            <input type="checkbox" id="recorrente">
            🔄 Recorrente todo mês
          </label>

          <button type="submit" id="btn-salvar">Adicionar</button>
        </form>
      </section>

      <!-- FILTROS -->
      <section class="filtros">
        <h2>Filtros</h2>
        <input type="month" id="filtro-mes" placeholder="Mês">
        <input type="text" id="filtro-categoria" placeholder="Ex: Mercado">
        <button id="btn-aplicar-filtro">🔍 Filtrar</button>
        <button id="btn-limpar-filtro">🧹 Limpar</button>
      </section>

      <!-- RECEITAS -->
      <section>
        <h2>📈 Receitas</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Valor</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista-receitas"></tbody>
          </table>
        </div>
      </section>

      <!-- DESPESAS -->
      <section>
        <h2>📉 Despesas</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Valor</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="lista-despesas"></tbody>
          </table>
        </div>
      </section>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
